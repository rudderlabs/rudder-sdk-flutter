name: rudder_integration_facebook_flutter
version: 1.0.0-dev.1
description: Facebook App Events device-mode integration for the RudderStack Flutter SDK. It adds the RudderStack Kotlin and Swift Facebook App Events integrations.
homepage: https://github.com/rudderlabs/rudder-sdk-flutter
repository: https://github.com/rudderlabs/rudder-sdk-flutter
issue_tracker: https://github.com/rudderlabs/rudder-sdk-flutter/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  rudder_sdk_flutter: ^4.0.0-dev.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rudderstack.sdk.flutter.integration.facebook
        pluginClass: RudderIntegrationFacebookFlutterPlugin
      ios:
        pluginClass: RudderIntegrationFacebookFlutterPlugin
