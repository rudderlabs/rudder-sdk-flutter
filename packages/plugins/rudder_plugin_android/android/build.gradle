group 'com.rudderstack.sdk.flutter'
version '1.0'

apply plugin: 'com.android.library'
// AGP 9+ ships built-in Kotlin support (unless Flutter opts out via android.builtInKotlin=false).
// Apply our own Kotlin plugin only when AGP won't — otherwise it clashes with Flutter's built-in Kotlin.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {
    compileSdk = 34

    defaultConfig {
        minSdkVersion = 16
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    namespace = "com.rudderstack.sdk.flutter"
}

dependencies {
    // Floor pinned to 1.28.1: this core version scopes the Serializable ProGuard
    // consumer rule to the persisted config graphs, restoring R8 optimization in
    // host apps (previously the rule kept every Serializable class app-wide).
    implementation 'com.rudderstack.android.sdk:core:[1.28.1, 2.0.0)'
    implementation 'com.google.code.gson:gson:2.8.6'
}
