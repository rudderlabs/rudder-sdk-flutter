name: rudder_sdk_flutter
version: 4.0.0-dev.1
description: The RudderStack Flutter SDK. It wraps the RudderStack Kotlin SDK on Android, the Swift SDK on iOS, and the JavaScript SDK on web.
homepage: https://github.com/rudderlabs/rudder-sdk-flutter
repository: https://github.com/rudderlabs/rudder-sdk-flutter
issue_tracker: https://github.com/rudderlabs/rudder-sdk-flutter/issues
documentation: https://docs.rudderstack.com/rudderstack-sdk-integration-guides/rudderstack-flutter-sdk

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.rudderstack.sdk.flutter
        pluginClass: RudderSdkFlutterPlugin
      ios:
        pluginClass: RudderSdkFlutterPlugin
      web:
        pluginClass: WebAnalyticsPlatform
        fileName: src/platform/web_analytics_platform.dart
