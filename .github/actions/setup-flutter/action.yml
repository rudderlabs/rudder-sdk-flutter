name: Setup Flutter
description: >-
  Install a Flutter SDK release archive and put it on PATH.
  It replaces subosito/flutter-action, which calls actions/cache by tag
  and fails when the org requires SHA-pinned actions (SEC-784).

inputs:
  channel:
    description: The release channel (stable or beta).
    required: false
    default: stable
  version:
    description: An exact Flutter version, or "any" for the newest release on the channel.
    required: false
    default: any
  architecture:
    description: The Dart SDK architecture (x64 or arm64).
    required: false
    default: x64
  sha256:
    description: >-
      The expected archive sha256. Set it together with an exact version.
      Without it, the step checks the archive against the sha256 in the
      Flutter release manifest.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Flutter
      shell: bash
      env:
        FLUTTER_CHANNEL: ${{ inputs.channel }}
        FLUTTER_VERSION: ${{ inputs.version }}
        FLUTTER_ARCH: ${{ inputs.architecture }}
        FLUTTER_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        if [ -n "$FLUTTER_SHA256" ] && [ "$FLUTTER_VERSION" = "any" ]; then
          echo "::error::sha256 needs an exact version, not \"any\"."
          exit 1
        fi

        FLUTTER_ARCH=$(echo "$FLUTTER_ARCH" | tr "[:upper:]" "[:lower:]")
        os_name=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        base_url="https://storage.googleapis.com/flutter_infra_release/releases"
        manifest=$(curl --fail --silent --show-error --connect-timeout 15 --retry 5 \
          "$base_url/releases_${os_name}.json")

        # The same release selection as subosito/flutter-action v2.23.0:
        # releases are newest first, and an entry without dart_sdk_arch is x64.
        release=$(echo "$manifest" | jq -c \
          --arg channel "$FLUTTER_CHANNEL" \
          --arg arch "$FLUTTER_ARCH" \
          --arg version "$FLUTTER_VERSION" \
          '[.releases[]
            | select(.channel == $channel)
            | select(.dart_sdk_arch == $arch or ($arch == "x64" and (has("dart_sdk_arch") | not)))
            | .version |= sub("^v"; "")
            | select($version == "any" or .version == $version)][0]')
        if [ "$release" = "null" ]; then
          echo "::error::No Flutter release for channel=$FLUTTER_CHANNEL version=$FLUTTER_VERSION arch=$FLUTTER_ARCH."
          exit 1
        fi

        version=$(echo "$release" | jq -r '.version')
        archive=$(echo "$release" | jq -r '.archive')
        expected="${FLUTTER_SHA256:-$(echo "$release" | jq -r '.sha256')}"
        if ! [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]; then
          echo "::error::The sha256 for Flutter $version is not 64 hex characters."
          exit 1
        fi

        install_dir="$RUNNER_TOOL_CACHE/flutter/${FLUTTER_CHANNEL}-${version}-${FLUTTER_ARCH}"
        archive_file="$RUNNER_TEMP/$(basename "$archive")"

        curl --fail --silent --show-error --location --connect-timeout 15 --retry 5 \
          --output "$archive_file" "$base_url/$archive"
        echo "${expected}  ${archive_file}" | shasum -a 256 --check --strict

        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        case "$archive_file" in
          *.zip) unzip -q -o "$archive_file" -d "$install_dir" ;;
          *) tar xf "$archive_file" -C "$install_dir" ;;
        esac
        rm -f "$archive_file"

        pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"
        {
          echo "FLUTTER_ROOT=$install_dir/flutter"
          echo "PUB_CACHE=$pub_cache"
        } >> "$GITHUB_ENV"
        {
          echo "$install_dir/flutter/bin"
          echo "$install_dir/flutter/bin/cache/dart-sdk/bin"
          echo "$pub_cache/bin"
        } >> "$GITHUB_PATH"

        echo "Installed Flutter $version ($FLUTTER_CHANNEL, $FLUTTER_ARCH) from $archive"
