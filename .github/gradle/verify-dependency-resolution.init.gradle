import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.api.artifacts.component.ProjectComponentSelector

// Check the same project configurations that the submission plugin resolves.
gradle.beforeProject { project ->
    project.tasks.configureEach { task ->
        if (task.name == 'ForceDependencyResolutionPlugin_resolveProjectDependencies') {
            task.doLast {
                def safelyResolvable = null
                try {
                    safelyResolvable = Class.forName('org.gradle.internal.deprecation.DeprecatableConfiguration')
                        .getMethod('canSafelyBeResolved')
                } catch (ReflectiveOperationException ignored) {
                    // Match the plugin's fallback on older Gradle versions.
                }
                def failures = []
                project.configurations.each { configuration ->
                    def canResolve = safelyResolvable == null ? configuration.canBeResolved : safelyResolvable.invoke(configuration)
                    if (canResolve) {
                        configuration.incoming.resolutionResult.allDependencies.each { dependency ->
                            if (dependency instanceof UnresolvedDependencyResult) {
                                // Flutter plugin projects are resolved separately. Kotlin metadata
                                // cannot choose among their Android build variants.
                                def pluginProjects = [
                                    ':rudder_integration_adjust_flutter', ':rudder_integration_amplitude_flutter',
                                    ':rudder_integration_appcenter_flutter', ':rudder_integration_appsflyer_flutter',
                                    ':rudder_integration_braze_flutter', ':rudder_integration_firebase_flutter',
                                    ':rudder_integration_kochava_flutter', ':rudder_integration_leanplum_flutter',
                                    ':rudder_plugin_android', ':rudder_plugin_db_encryption',
                                ]
                                def knownMetadataMismatch = (project.path == ':app' &&
                                    configuration.name ==~ /(debug|profile|release)(Api|Implementation)DependenciesMetadata/ &&
                                    dependency.attempted instanceof ProjectComponentSelector &&
                                    dependency.attempted.projectPath in pluginProjects &&
                                    project.rootProject.findProject(dependency.attempted.projectPath) != null &&
                                    dependency.failure.cause?.class?.name == 'org.gradle.internal.component.resolution.failure.exception.VariantSelectionByAttributesException' &&
                                    dependency.failure.cause?.message?.contains("cannot choose between the following variants of project ${dependency.attempted.projectPath}"))
                                if (!knownMetadataMismatch) {
                                    failures << "${project.path}:${configuration.name}: ${dependency.attempted} (${dependency.failure.message})"
                                }
                            }
                        }
                    }
                }
                if (!failures.empty) {
                    throw new GradleException('Dependency graph resolution is incomplete:\n' + failures.join('\n'))
                }
            }
        }
    }
}
