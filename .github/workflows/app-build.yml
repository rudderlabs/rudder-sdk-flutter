name: App Build

on:
  pull_request:
    branches: ['develop', 'main', 'feat/flutter-v4']
    types: ['opened', 'reopened', 'synchronize']
    paths:
      - 'packages/**'
      - '.github/scripts/app-build-check.sh'
      - '.github/workflows/app-build.yml'

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-build:
    name: ${{ matrix.platform }} build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
            architecture: x64
          - platform: ios
            runner: macos-latest
            architecture: arm64
          - platform: web
            runner: ubuntu-latest
            architecture: x64

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable
          version: '3.50.0'
          architecture: ${{ matrix.architecture }}

      - name: Build a new app with the RudderStack packages
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/app-build-check.sh "$GITHUB_WORKSPACE" "$PLATFORM" "$RUNNER_TEMP/app-build"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-build-${{ matrix.platform }}-logs
          path: ${{ runner.temp }}/app-build/*.log
          retention-days: 7
          if-no-files-found: ignore
