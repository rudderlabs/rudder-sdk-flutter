name: Draft new release

on:
  workflow_dispatch:
    inputs:
      release_ticket_id:
        description: 'Linear release ticket ID, for example SDK-5380'
        required: true
        type: string
      slack_message_link:
        description: 'Slack message URL for the release thread'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-new-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-new-release:
    name: Draft a new release
    runs-on: ubuntu-latest
    permissions:
      contents: read  # GITHUB_TOKEN only needs read for checkout
    if: startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/hotfix/')
    outputs:
      package_summary: ${{ steps.release-packages.outputs.package_summary }}
      release_branch: ${{ steps.create-release.outputs.branch_name }}
      release_pr_url: ${{ steps.create-pr.outputs.pr_url }}
      release_version: ${{ steps.create-release.outputs.new_version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create commits and branches
          permission-pull-requests: write # to create PRs that trigger CI checks

      - name: Checkout source branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e #v2.21.0
        with:
          channel: 'stable'
          architecture: x64

      - name: Install Melos
        run: |
          dart pub global activate melos 6.3.3

      - name: Validate release inputs
        env:
          RELEASE_TICKET_ID: ${{ inputs.release_ticket_id }}
          SLACK_MESSAGE_LINK: ${{ inputs.slack_message_link }}
        run: |
          if [[ ! "$RELEASE_TICKET_ID" =~ ^[A-Z]+-[0-9]+$ ]]; then
            echo "Release ticket ID must use a format such as SDK-5380." >&2
            exit 1
          fi

          if [[ ! "$SLACK_MESSAGE_LINK" =~ ^https://rudderlabs\.slack\.com/archives/[^/]+/p[0-9]+ ]]; then
            echo "Slack message URL must link to a rudderlabs.slack.com message." >&2
            exit 1
          fi

      # In order to make a commit, we need to initialize a user.
      # You may choose to write something less generic here if you want, it doesn't matter functionality wise.
      - name: Initialize mandatory git config
        run: |
          git config user.name "GitHub actions"
          git config user.email noreply@github.com

      # Calculate the next release version based on conventional semantic release
      - name: Create release branch
        id: create-release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          source_branch_name=${GITHUB_REF##*/}
          release_type=release
          grep -q "hotfix/" <<< "${GITHUB_REF}" && release_type=hotfix-release
          git fetch origin main
          git fetch --tags origin
          git merge origin/main
          current_version=$(grep -A0 'version:' pubspec.yaml | tail -n1 | awk '{ print $2 }')

          melos version -a --no-git-tag-version --no-changelog --yes --no-git-commit-version
          new_version=$(grep -A0 'version:' pubspec.yaml | tail -n1 | awk '{ print $2 }')
          git reset --hard

          branch_name="${release_type}/${new_version}"

          echo "Source branch for new release is $source_branch_name"
          echo "Current version is $current_version"
          echo "Release type is $release_type"
          echo "New version is $new_version"
          echo "New release branch name is $branch_name"
          git checkout -b "$branch_name"

          echo "source_branch_name=$source_branch_name" >> $GITHUB_OUTPUT
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "CURRENT_VERSION_VALUE=$current_version" >> $GITHUB_ENV
          echo "NEW_VERSION_VALUE=$new_version" >> $GITHUB_ENV

      - name: Create release branch via GitHub API
        id: create-branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH_NAME: ${{ steps.create-release.outputs.branch_name }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            -f ref="refs/heads/${BRANCH_NAME}" \
            -f sha="$BASE_SHA"

          # `melos version` runs `git pull --tags`, which needs branch tracking.
          # Creating the ref over the API does not set it.
          git fetch origin "$BRANCH_NAME"
          git branch --set-upstream-to="origin/${BRANCH_NAME}" "$BRANCH_NAME"

          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT

      - name: Update changelog & bump version
        id: finish-release
        run: |
          echo "Current version: $CURRENT_VERSION_VALUE"
          echo "New version: $NEW_VERSION_VALUE"
          npx replace $CURRENT_VERSION_VALUE $NEW_VERSION_VALUE sonar-project.properties
          git add sonar-project.properties
          melos version -a --yes

      - name: Prepare version changes
        id: prepare-changes
        env:
          BASE_SHA: ${{ steps.create-branch.outputs.base_sha }}
        run: |
          # The signed-commit action commits *staged* changes, and melos has already
          # committed them. Rewind so the release tree sits in the index instead.
          git add .
          git reset --soft "$BASE_SHA"

          # `files` is a multi-line input, so the newlines have to survive GITHUB_OUTPUT.
          {
            echo "changed_files<<CHANGED_FILES_EOF"
            git diff --cached --name-only
            echo "CHANGED_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Files to publish:"
          git diff --cached --name-only

      - name: Push signed version changes
        id: push-changes
        uses: ryancyq/github-signed-commit@e9f3b28c80da7be66d24b8f501a5abe82a6b855f # v1.2.0
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          branch-name: ${{ steps.create-release.outputs.branch_name }}
          commit-message: "chore: version bump to ${{ steps.create-release.outputs.new_version }}"
          files: ${{ steps.prepare-changes.outputs.changed_files }}

      - name: Create ordered release package manifest
        id: release-packages
        env:
          BASE_SHA: ${{ steps.create-branch.outputs.base_sha }}
          BRANCH_NAME: ${{ steps.create-release.outputs.branch_name }}
          HEAD_SHA: ${{ steps.push-changes.outputs.commit-sha }}
        run: |
          manifest="$RUNNER_TEMP/release-packages.json"
          git fetch origin "$BRANCH_NAME"
          dart tool/release_packages.dart \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$manifest"

          package_count=$(jq '.packages | length' "$manifest")
          if [ "$package_count" -eq 0 ]; then
            echo "No package version changes were found." >&2
            exit 1
          fi

          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "package_summary=$(jq -r '[.packages[] | "\(.name) \(.version)"] | join(" · ")' "$manifest")" >> "$GITHUB_OUTPUT"
          {
            echo "## Release packages"
            echo
            echo '| Order | Package | Version | Path | Tag |'
            echo '| ---: | --- | --- | --- | --- |'
            jq -r '.packages | to_entries[] | "| \(.key + 1) | `\(.value.name)` | `\(.value.version)` | `\(.value.path)` | `\(.value.tag)` |"' "$manifest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release package manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packages-${{ steps.create-release.outputs.new_version }}
          path: ${{ steps.release-packages.outputs.manifest }}
          if-no-files-found: error

      - name: Create pull request into main
        id: create-pr
        uses: repo-sync/pull-request@7e79a9f5dc3ad0ce53138f01df2fad14a04831c5 #v2
        with:
          source_branch: ${{ steps.create-release.outputs.branch_name }}
          destination_branch: 'main'
          github_token: ${{ steps.generate-token.outputs.token }}
          pr_title: 'chore(release): pull ${{ steps.create-release.outputs.branch_name }} into main'
          pr_body: ':crown: *An automated PR*'

  notify-slack:
    name: Notify the release Slack thread
    needs: [draft-new-release]
    if: ${{ needs.draft-new-release.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Read Slack thread from message URL
        id: slack-thread
        env:
          SLACK_MESSAGE_LINK: ${{ inputs.slack_message_link }}
        run: |
          channel_id=$(sed -n 's|.*/archives/\([^/]*\)/.*|\1|p' <<< "$SLACK_MESSAGE_LINK")

          if grep -q 'thread_ts=' <<< "$SLACK_MESSAGE_LINK"; then
            thread_ts=${SLACK_MESSAGE_LINK#*thread_ts=}
            thread_ts=${thread_ts%%&*}
            thread_ts=${thread_ts//%2E/.}
            thread_ts=${thread_ts//%2e/.}
          else
            raw_ts=$(sed -n 's|.*/p\([0-9]*\).*|\1|p' <<< "$SLACK_MESSAGE_LINK")
            thread_ts="${raw_ts:0:10}.${raw_ts:10:6}"
          fi

          if [[ ! "$channel_id" =~ ^[A-Z0-9]+$ ]] || [[ ! "$thread_ts" =~ ^[0-9]{10}\.[0-9]{6}$ ]]; then
            echo "Could not read the Slack channel or thread from the message URL." >&2
            exit 1
          fi

          echo "channel_id=$channel_id" >> "$GITHUB_OUTPUT"
          echo "thread_ts=$thread_ts" >> "$GITHUB_OUTPUT"

      - name: Store release thread data
        uses: ./.github/actions/slack-release-notify
        with:
          mode: upload-artifact
          channel_id: ${{ steps.slack-thread.outputs.channel_id }}
          thread_ts: ${{ steps.slack-thread.outputs.thread_ts }}
          release_version: ${{ needs.draft-new-release.outputs.release_version }}
          release_ticket_id: ${{ inputs.release_ticket_id }}

      - name: Build release pull request message
        id: message
        env:
          PACKAGE_SUMMARY: ${{ needs.draft-new-release.outputs.package_summary }}
          RELEASE_BRANCH: ${{ needs.draft-new-release.outputs.release_branch }}
          RELEASE_PR_URL: ${{ needs.draft-new-release.outputs.release_pr_url }}
          RELEASE_TICKET_ID: ${{ inputs.release_ticket_id }}
          RELEASE_VERSION: ${{ needs.draft-new-release.outputs.release_version }}
        run: |
          message=":rocket: *Flutter release PR is ready*"
          message+=$'\n'"*Release:* v$RELEASE_VERSION"
          message+=$'\n'"*Branch:* \`$RELEASE_BRANCH\`"
          message+=$'\n'"*Packages:* $PACKAGE_SUMMARY"
          message+=$'\n'"*Pull request:* <$RELEASE_PR_URL|Review release PR>"
          message+=$'\n'"*Linear:* <https://linear.app/rudderstack/issue/$RELEASE_TICKET_ID|$RELEASE_TICKET_ID>"
          message+=$'\n'"CC: <!subteam^S066Z6BUTAS> <!subteam^S03SW7DM8P3>"

          delimiter=$(openssl rand -hex 16)
          {
            echo "text<<$delimiter"
            echo "$message"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Post release pull request message
        uses: ./.github/actions/slack-release-notify
        with:
          mode: post-thread
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel_id: ${{ steps.slack-thread.outputs.channel_id }}
          thread_ts: ${{ steps.slack-thread.outputs.thread_ts }}
          message: ${{ steps.message.outputs.text }}
