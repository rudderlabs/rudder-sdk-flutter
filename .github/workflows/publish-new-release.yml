name: Publish new github release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

env:
  SDK_SLACK_GROUP_MENTION: '<!subteam^S02AEQS0GSF>' # sdk-eng (@sdk)

concurrency:
  group: publish-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish new release
    runs-on: ubuntu-latest
    permissions:
      contents: read  # GITHUB_TOKEN only needs read for checkout
    if: (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix-release/')) && github.event.pull_request.merged == true # only merged pull requests must trigger this job
    outputs:
      backmerge_pr_url: ${{ steps.back-merge.outputs.pr_url }}
      failed_package: ${{ steps.package-publications.outputs.failed_package }}
      failure_url: ${{ steps.package-publications.outputs.failure_url }}
      package_summary: ${{ steps.release-packages.outputs.package_summary }}
      release_version: ${{ steps.extract-version.outputs.release_version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Extract version from branch name (for release branches)
        id: extract-version
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${BRANCH_NAME#hotfix-}"
          VERSION="${VERSION#release/}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release branch must end with a semantic version such as 5.4.3." >&2
            exit 1
          fi

          echo "release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # In order to make a commit, we need to initialize a user.
      # You may choose to write something less generic here if you want, it doesn't matter functionality wise.
      - name: Initialize mandatory git config
        run: |
          git config user.name "GitHub actions"
          git config user.email noreply@github.com

      - name: Create ordered release package manifest
        id: release-packages
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          parent_count=$(git rev-list --parents -n 1 "$MERGE_SHA" | awk '{ print NF - 1 }')
          if [ "$parent_count" -ne 2 ]; then
            echo "The release pull request must use a merge commit." >&2
            exit 1
          fi

          manifest="$RUNNER_TEMP/release-packages.json"
          dart tool/release_packages.dart \
            --base "$MERGE_SHA^1" \
            --head "$MERGE_SHA" \
            --output "$manifest"

          package_count=$(jq '.packages | length' "$manifest")
          if [ "$package_count" -eq 0 ]; then
            echo "No package version changes were found." >&2
            exit 1
          fi

          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "package_summary=$(jq -r '[.packages[] | "\(.name) \(.version)"] | join(" · ")' "$manifest")" >> "$GITHUB_OUTPUT"
          {
            echo "## Release packages"
            echo
            echo '| Order | Package | Version | Path | Tag |'
            echo '| ---: | --- | --- | --- | --- |'
            jq -r '.packages | to_entries[] | "| \(.key + 1) | `\(.value.name)` | `\(.value.version)` | `\(.value.path)` | `\(.value.tag)` |"' "$manifest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release package manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-${{ steps.extract-version.outputs.release_version }}
          path: ${{ steps.release-packages.outputs.manifest }}
          if-no-files-found: error

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create tags and releases
          permission-pull-requests: write # to create PRs that trigger CI checks

      - name: Check existing monorepo release
        id: existing-release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_VERSION: ${{ steps.extract-version.outputs.release_version }}
        run: |
          tag="v$RELEASE_VERSION"
          existing_sha=$(git rev-list -n 1 "$tag" 2>/dev/null || true)

          if [ -n "$existing_sha" ] && [ "$existing_sha" != "$MERGE_SHA" ]; then
            echo "$tag points to $existing_sha, not $MERGE_SHA." >&2
            exit 1
          fi

          if [ -n "$existing_sha" ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if gh api "repos/${{ github.repository }}/releases/tags/$tag" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push signed tag
        if: ${{ steps.existing-release.outputs.tag_exists != 'true' }}
        uses: ryancyq/github-signed-commit@e9f3b28c80da7be66d24b8f501a5abe82a6b855f # v1.2.0
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          branch-name: main
          commit-message: "chore: release v${{ steps.extract-version.outputs.release_version }}"
          tag: 'v${{ steps.extract-version.outputs.release_version }}'
          files: ''

      - name: Create GitHub Release
        if: ${{ steps.existing-release.outputs.release_exists != 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CONVENTIONAL_GITHUB_RELEASER_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # The step above created the tag remotely, after checkout fetched tags. The
          # releaser reads *local* tags, so without this it targets the previous release.
          git fetch origin --tags --force

          # The releaser matches a semver anywhere in the decoration, so a branch ref like
          # `origin/release/5.3.3` reads as a tag and steals the release notes.
          git config log.excludeDecoration 'refs/remotes/origin/release/*'
          git config --add log.excludeDecoration 'refs/remotes/origin/hotfix-release/*'

          DEBUG=conventional-github-releaser npx conventional-github-releaser -p angular --config github-release.config.js

      - name: Create package tags on the merged commit
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          MANIFEST: ${{ steps.release-packages.outputs.manifest }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_VERSION: ${{ steps.extract-version.outputs.release_version }}
        run: |
          create_tag() {
            tag="$1"
            # `gh api` writes the 404 response body to stdout. Clear the captured
            # value when the tag does not exist so the response is not read as a SHA.
            if ! existing_sha=$(gh api \
              "repos/${{ github.repository }}/git/ref/tags/$tag" \
              --jq '.object.sha' 2>/dev/null); then
              existing_sha=''
            fi

            if [ -n "$existing_sha" ]; then
              if [ "$existing_sha" != "$MERGE_SHA" ]; then
                echo "Tag $tag already points to $existing_sha, not $MERGE_SHA." >&2
                exit 1
              fi
              echo "Tag $tag already points to $MERGE_SHA."
              return
            fi

            echo "Creating $tag at $MERGE_SHA."
            gh api "repos/${{ github.repository }}/git/refs" \
              --method POST \
              -f ref="refs/tags/$tag" \
              -f sha="$MERGE_SHA"
          }

          create_tag "rudder_sdk_flutter_monorepo-v$RELEASE_VERSION"
          while IFS= read -r tag; do
            create_tag "$tag"
          done < <(jq -r '.packages[].tag' "$MANIFEST")

      - name: Wait for package publications
        id: package-publications
        env:
          MANIFEST: ${{ steps.release-packages.outputs.manifest }}
        run: |
          while IFS=$'\t' read -r package version; do
            published=false

            for attempt in $(seq 1 60); do
              package_data=$(curl --fail --silent --show-error --retry 3 \
                "https://pub.dev/api/packages/$package" || true)
              if jq -e --arg version "$version" \
                'any(.versions[]?; .version == $version)' <<< "$package_data" >/dev/null; then
                published=true
                echo "$package $version is available on pub.dev."
                break
              fi

              echo "Attempt $attempt of 60: waiting for $package $version on pub.dev."
              sleep 10
            done

            if [ "$published" != "true" ]; then
              echo "failed_package=$package $version" >> "$GITHUB_OUTPUT"
              echo "failure_url=https://pub.dev/packages/$package/versions/$version" >> "$GITHUB_OUTPUT"
              echo "pub.dev did not report $package $version after 10 minutes." >&2
              exit 1
            fi
          done < <(jq -r '.packages[] | [.name, .version] | @tsv' "$MANIFEST")

      - name: Create pull request into develop
        id: back-merge
        uses: repo-sync/pull-request@7e79a9f5dc3ad0ce53138f01df2fad14a04831c5 #v2
        with:
          source_branch: 'main'
          destination_branch: 'develop'
          github_token: ${{ steps.generate-token.outputs.token }}
          pr_title: 'chore(release): pulling main into develop post release v${{ steps.extract-version.outputs.release_version }}'
          pr_body: ':crown: *An automated PR*'

      - name: Delete hotfix release branch
        uses: koj-co/delete-merged-action@63a03c35810a8a7d4840d18793c0f68ff8b59450 # master
        if: startsWith(github.event.pull_request.head.ref, 'hotfix-release/')
        with:
          branches: 'hotfix-release/*'
        env:
          # Lists PRs before deleting, so it needs pull-requests read + contents write.
          # GITHUB_TOKEN has neither: the job pins it to `contents: read`.
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Delete release branch
        uses: koj-co/delete-merged-action@63a03c35810a8a7d4840d18793c0f68ff8b59450 # master
        if: startsWith(github.event.pull_request.head.ref, 'release/')
        with:
          branches: 'release/*'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}


  notify-slack:
    name: Notify Slack about the release result
    needs: [release]
    if: ${{ always() && needs.release.result != 'skipped' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Extract release version for notification
        id: release-version
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${BRANCH_NAME#hotfix-}"
          VERSION="${VERSION#release/}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release branch must end with a semantic version such as 5.4.3." >&2
            exit 1
          fi

          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read release thread data
        id: release-thread
        uses: ./.github/actions/slack-release-notify
        with:
          mode: download-artifact
          release_version: ${{ steps.release-version.outputs.release_version }}

      - name: Build success channel message
        id: success-channel-message
        if: ${{ needs.release.result == 'success' }}
        env:
          PACKAGE_SUMMARY: ${{ needs.release.outputs.package_summary }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.release_version }}
        run: |
          message=":rocket: *New release: Flutter SDK*"
          message+=$'\n'"*Release:* <https://github.com/${{ github.repository }}/releases/tag/v$RELEASE_VERSION|v$RELEASE_VERSION>"
          message+=$'\n'"*Packages:* $PACKAGE_SUMMARY"
          message+=$'\n'"CC: $SDK_SLACK_GROUP_MENTION"

          delimiter=$(openssl rand -hex 16)
          {
            echo "text<<$delimiter"
            echo "$message"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Post success channel message
        if: ${{ needs.release.result == 'success' }}
        uses: ./.github/actions/slack-release-notify
        with:
          mode: post-channel
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel_id: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          message: ${{ steps.success-channel-message.outputs.text }}

      - name: Build success thread message
        id: success-thread-message
        if: ${{ needs.release.result == 'success' }}
        env:
          BACKMERGE_PR_URL: ${{ needs.release.outputs.backmerge_pr_url }}
          PACKAGE_SUMMARY: ${{ needs.release.outputs.package_summary }}
          RELEASE_TICKET_ID: ${{ steps.release-thread.outputs.release_ticket_id }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.release_version }}
        run: |
          message=":white_check_mark: *Flutter release v$RELEASE_VERSION is complete*"
          message+=$'\n'"*Published to pub.dev:* $PACKAGE_SUMMARY"
          message+=$'\n'"*Back-merge:* <$BACKMERGE_PR_URL|Review back-merge PR>"
          message+=$'\n'"*Linear:* <https://linear.app/rudderstack/issue/$RELEASE_TICKET_ID|$RELEASE_TICKET_ID>"
          message+=$'\n'"CC: $SDK_SLACK_GROUP_MENTION"

          delimiter=$(openssl rand -hex 16)
          {
            echo "text<<$delimiter"
            echo "$message"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Post success thread message
        if: ${{ needs.release.result == 'success' }}
        uses: ./.github/actions/slack-release-notify
        with:
          mode: post-thread
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel_id: ${{ steps.release-thread.outputs.channel_id }}
          thread_ts: ${{ steps.release-thread.outputs.thread_ts }}
          message: ${{ steps.success-thread-message.outputs.text }}

      - name: Build failure thread message
        id: failure-thread-message
        if: ${{ needs.release.result != 'success' }}
        env:
          FAILED_PACKAGE: ${{ needs.release.outputs.failed_package || 'release workflow' }}
          FAILURE_URL: ${{ needs.release.outputs.failure_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          RELEASE_VERSION: ${{ steps.release-version.outputs.release_version }}
        run: |
          message=":x: *Flutter release v$RELEASE_VERSION failed*"
          message+=$'\n'"*Failed item:* $FAILED_PACKAGE"
          message+=$'\n'"*Details:* <$FAILURE_URL|View failure details>"
          message+=$'\n'"Fix the cause. Then restart the failed package workflow and this release workflow."
          message+=$'\n'"CC: $SDK_SLACK_GROUP_MENTION"

          delimiter=$(openssl rand -hex 16)
          {
            echo "text<<$delimiter"
            echo "$message"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Post failure thread message
        if: ${{ needs.release.result != 'success' }}
        uses: ./.github/actions/slack-release-notify
        with:
          mode: post-thread
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel_id: ${{ steps.release-thread.outputs.channel_id }}
          thread_ts: ${{ steps.release-thread.outputs.thread_ts }}
          message: ${{ steps.failure-thread-message.outputs.text }}
