    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pub'
    directory: '/packages/integrations/rudder_integration_appcenter_flutter'
    open-pull-requests-limit: 0
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pub'
    directory: '/packages/integrations/rudder_integration_appsflyer_flutter'
    open-pull-requests-limit: 0
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pub'
    directory: '/packages/integrations/rudder_integration_braze_flutter'
    open-pull-requests-limit: 0
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pub'
    directory: '/packages/integrations/rudder_integration_firebase_flutter'
    open-pull-requests-limit: 0
