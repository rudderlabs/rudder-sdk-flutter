version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    open-pull-requests-limit: 0
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'pub'
    directory: '/'
    open-pull-requests-limit: 0
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pub'
    directory: '/example'
    open-pull-requests-limit: 0
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pub'
    directory: '/packages/plugins/rudder_plugin'
    open-pull-requests-limit: 0
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pub'
    directory: '/packages/plugins/rudder_plugin_android'
    open-pull-requests-limit: 0
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7

  - package-ecosystem: 'pub'
    directory: '/packages/plugins/rudder_plugin_db_encryption'
    open-pull-requests-limit: 0
